<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Integration - Nexus AI</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 h-screen flex flex-col">
  <div id="root" class="h-full"></div>
  <script type="text/babel">
    const { useState } = React;
    const WIDGET_URL = window.location.origin;

    function EmbedPage() {
      const [token] = useState(localStorage.getItem('token'));
      const [username] = useState(localStorage.getItem('username'));

      if(!token) { window.location.href = '/login'; return null; }

      const scriptCode = `<script src="${WIDGET_URL}/widget.js" data-username="${username}"><\/script>`;
      
      const copy = () => {
          navigator.clipboard.writeText(scriptCode);
          alert('Copied to clipboard!');
      };

      return (
        <div className="min-h-screen flex">
            {/* Simple Sidebar for context */}
            <div className="w-64 bg-slate-900 text-white p-6 border-r border-slate-800">
                <h2 className="font-bold mb-8">NEXUS AI</h2>
                <a href="/dashboard" className="block text-slate-400 hover:text-white mb-4">← Back to Dashboard</a>
            </div>

            <div className="flex-1 p-12 bg-white">
                <h1 className="text-3xl font-bold mb-4">Integration</h1>
                <p className="text-slate-500 mb-8 max-w-xl">
                    Add your trained AI assistant to any website by pasting this snippet into the 
                    <code className="bg-slate-100 px-1 rounded text-sm text-pink-500">&lt;body&gt;</code> tag.
                </p>

                <div className="max-w-3xl bg-slate-900 rounded-xl overflow-hidden shadow-2xl">
                    <div className="bg-slate-800 px-4 py-2 flex justify-between items-center">
                        <div className="flex gap-2">
                            <div className="w-3 h-3 rounded-full bg-red-500"></div>
                            <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                            <div className="w-3 h-3 rounded-full bg-green-500"></div>
                        </div>
                        <button onClick={copy} className="text-xs text-white bg-white/10 hover:bg-white/20 px-3 py-1 rounded transition-colors uppercase tracking-wider font-bold">Copy Code</button>
                    </div>
                    <div className="p-6 overflow-x-auto">
                        <pre className="text-green-400 font-mono text-sm whitespace-pre-wrap">{scriptCode}</pre>
                    </div>
                </div>
            </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<EmbedPage />);
  </script>
</body>
</html>
